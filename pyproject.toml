[project]
name = "self-driving-lab"
version = "0.1.0"
description = "Thin Level-4 open-source SDL orchestration with a tonic dilution / IFE closed loop"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "fractalclockwork" }]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
